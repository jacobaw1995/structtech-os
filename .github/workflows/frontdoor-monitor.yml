# StructTech OS — front-door monitor.  Track X, X-W1.1, 2026-09-02.
#
# HOST CHOICE, and why it is GitHub Actions rather than Vercel Cron:
#   · Free and unmetered on a public repo.
#   · INDEPENDENT OF VERCEL.  os.structtek.com is a Vercel deployment; a
#     monitor hosted on Vercel dies with the thing it watches and reports
#     nothing at the exact moment it is needed.
#   · It already has an alert channel that costs no new account: GitHub emails
#     the repository owner when a scheduled workflow fails.
#   · Known blind spot, stated rather than hidden: audit.structtek.com is
#     GitHub Pages, so a GitHub-wide incident can take out that door and this
#     monitor together.  No free host is independent of both.  Closing it
#     needs an external dead-man's switch — see track-x/ACCOUNT_INVENTORY.
#
# WHEN THE MONITOR ITSELF DIES:
#   A red run emails the owner.  SILENCE DOES NOT.  GitHub's own dead-man
#   behaviours (it disables schedules on a repo with 60 days of no activity,
#   and emails the owner when it does) are the only free backstop, and
#   scheduled runs are best-effort — GitHub drops them under load.  So
#   "no failure email" is NOT evidence the doors are up.  The heartbeat
#   account in the inventory is what turns that from a hope into a control.

name: front-door monitor

on:
  schedule:
    # HOURLY, AT :23.  It was '*/15' from 2026-09-02 until 2026-09-04, and the
    # platform delivered 7.9% of that: 6 runs in 19.01 hours, mean gap 228 min,
    # worst gap 310 min, every one of them green.  Scheduled runs are
    # best-effort and GitHub deprioritises high-frequency crons hardest; asking
    # for 96 runs a day on a free public repo bought 6.  The quarter-hour and
    # top-of-hour slots are also the most contended, hence :23 rather than :00.
    #
    # THIS NUMBER IS A HYPOTHESIS, NOT A FIX.  Whether a smaller ask is honoured
    # more reliably is a claim about GitHub's queue that has not been measured
    # HERE yet.  The drift check below is what makes the next reading exist; if
    # hourly delivers no better, the answer is an external scheduler, not a
    # smaller number.
    #
    # GitHub runs `schedule` on the DEFAULT BRANCH only — that is why nothing
    # fired at all until this file reached `main` on 2026-09-03T20:59Z.
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    # Present so the monitor and its failure-path proof can be exercised in
    # the real runner from a branch, before anything is trusted on main.
    paths:
      - 'scripts/monitor/**'
      - '.github/workflows/frontdoor-monitor.yml'

concurrency:
  group: front-door-monitor
  cancel-in-progress: false

permissions:
  contents: read
  # Needed by the drift check, which reads this workflow's own run history.
  # GITHUB_TOKEN only — no new credential, no new account.
  actions: read

jobs:
  monitor:
    name: check the front doors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The Material Matrix guard failed because `cmp` and `diff` were not in
      # the build image and `command not found` was reported as a finding.
      # This step makes the equivalent impossible to introduce silently: the
      # monitor is asserted to use no external binary at all.
      - name: assert the monitor needs no external binaries
        run: |
          if grep -nE "child_process|execSync|spawnSync" scripts/monitor/*.mjs; then
            echo "::error::the monitor shells out — it can now fail on a missing binary (the MM failure mode)"
            exit 1
          fi
          node --check scripts/monitor/frontdoor-monitor.mjs
          node --check scripts/monitor/schedule-drift.mjs
          echo "node $(node -v); no shell-outs; no npm install"

      - name: run the monitor
        run: node scripts/monitor/frontdoor-monitor.mjs

      # AFTER the door check on purpose: a real outage must not be masked by a
      # drift complaint, and the door verdict is the more important of the two.
      # `always()` so drift is still reported on a run where the doors are red.
      - name: schedule-drift — did the platform deliver the rate we asked for?
        if: always() && github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCHEDULE_NOMINAL_MINUTES: '60'
          # 8h. Raised from 360 by controller decision (Jacob, 2026-09-06) and
          # applied 2026-09-07, when the decision was found not to have reached
          # the repository. 360 was too tight against the measured worst gap and
          # the measurement proved it before the fix landed: the scheduled run
          # at 2026-09-07T16:29:54Z went RED on a gap of 366.0 min — six minutes
          # of overshoot, with every door green. That is an alarm firing on
          # ordinary queue variance, which is the fastest way to teach someone
          # to ignore this workflow's email.
          #
          # Measured baseline at n=21 over 76.39 h: mean gap 208.3 min, worst
          # 365.8 min. 480 leaves ~31% headroom over the worst observed.
          SCHEDULE_MAX_GAP_MINUTES: '480'
        run: node scripts/monitor/schedule-drift.mjs

      # DEAD-MAN'S PING — the only control that can catch the schedule DYING
      # rather than merely degrading. The drift check above runs INSIDE a
      # scheduled run, so if the schedule stops entirely it never executes and
      # says nothing; GitHub emails on a RED run and never on an ABSENT one.
      # An external service that alerts when a ping FAILS TO ARRIVE closes
      # that, and nothing hosted here can.
      #
      # BUILT INERT ON PURPOSE. `DEADMAN_PING_URL` does not exist yet. The
      # step's `if` reads the secret through an env var (secrets are not
      # available in step-level `if` expressions directly) and SKIPS with a
      # visible notice when it is absent, so this never fails a run while the
      # account does not exist and works the moment it does — no second edit.
      #
      # It runs on `success()` only. Pinging after a FAILED door check would
      # tell the dead-man's service "alive" at the exact moment the monitor is
      # reporting an outage, which is the one time the two signals must not be
      # merged. A red run emails; this is for silence.
      - name: dead-man's ping (skips until DEADMAN_PING_URL exists)
        if: success() && github.event_name == 'schedule'
        env:
          DEADMAN_PING_URL: ${{ secrets.DEADMAN_PING_URL }}
        run: |
          # Explicit rather than inherited. GitHub's default `run` shell is
          # `bash -e`, so a failing curl would abort anyway — but exercising
          # this block locally under a plain `bash -c` printed "ping
          # delivered" after curl had failed to resolve the host, exit 0.
          # A dead-man's ping that reports delivery it did not achieve is
          # worse than no ping: the external service alerts, and the run log
          # says everything was fine. Do not depend on the harness default.
          set -euo pipefail
          if [ -z "${DEADMAN_PING_URL:-}" ]; then
            echo "::notice title=dead-man's ping not configured::DEADMAN_PING_URL is not set, so nothing is watching for this workflow's SILENCE. The drift check catches degradation; only this catches death. See scripts/monitor/README-deadman.md."
            exit 0
          fi
          # --fail so an HTTP error is a real failure; -sS to stay quiet but
          # still print the error. The URL is a secret and is never echoed.
          curl --fail --silent --show-error --max-time 20 \
               --retry 3 --retry-delay 5 --retry-all-errors \
               -o /dev/null "$DEADMAN_PING_URL"
          echo "dead-man's ping delivered."

  failure-path-proof:
    # Not on the schedule — this is the guard on the guard.  It runs whenever
    # the monitor changes, and goes red the moment the monitor loses its
    # ability to tell "the door is broken" from "I could not tell".
    name: prove the failure paths in the real runner
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: classifier self-test (the branches production must never reach)
        run: MONITOR_SELFTEST=1 node scripts/monitor/frontdoor-monitor.mjs

      - name: fault injection — each mode must produce its OWN verdict
        run: |
          set -u
          fails=0
          expect () {          # expect <mode> <exit-code> <why>
            mode="$1"; want="$2"; why="$3"
            echo "::group::MONITOR_FAULT=$mode  (expect exit $want — $why)"
            set +e
            MONITOR_FAULT="$mode" MONITOR_TIMEOUT_MS="${4:-15000}" node scripts/monitor/frontdoor-monitor.mjs
            got=$?
            set -e
            echo "--> exit $got (wanted $want)"
            echo "::endgroup::"
            if [ "$got" != "$want" ]; then
              echo "::error::fault mode '$mode' exited $got, wanted $want — $why"
              fails=$((fails+1))
            fi
          }

          # 0 = healthy · 1 = FAIL (outage claim) · 2 = ERROR (undetermined)
          expect ""         0 "the real doors are up"
          expect content    1 "real hosts, real 200s, required content absent — this MUST read as an outage"
          expect network    2 "unresolvable host — the monitor is blind, the doors may be fine. MUST NOT read as an outage"
          expect timeout    2 "the monitor was too slow — MUST NOT read as an outage" 1
          expect noconfig   2 "no target configured — 'I was never told where to look' is not 'it is down'"

          if [ "$fails" -ne 0 ]; then
            echo "::error::$fails fault mode(s) misgraded. The monitor cannot tell an outage from its own breakage; do not trust it."
            exit 1
          fi
          echo "All fault modes graded correctly in the real runner."
